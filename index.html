<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/macbook.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio de Jonathan Morera</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        const saved = JSON.parse(localStorage.getItem("portfolio-theme") || "{}");
        const theme = saved.state?.theme ?? "system";
        const dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
